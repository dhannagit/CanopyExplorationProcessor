[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy-exploration-processor"
version = "0.1.0"
description = "Exploration-agnostic analysis of Canopy simulation sweeps."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
test = ["pytest>=8", "PyYAML>=6"]
release = ["build>=1.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "PyYAML>=6"]

[[tool.uv.index]]
name = "artifactory"
url = "https://artifactory.michelin.com/api/pypi/pypi/simple"
default = true

[project.scripts]
canopy-exploration-gui = "canopy_processor.ui.app:main"

[project.gui-scripts]
canopy-exploration = "canopy_processor.ui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
canopy_processor = ["runtime-requirements.txt"]